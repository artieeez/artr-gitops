apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: code-factory-workers
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/artieeez/artr-gitops
    targetRevision: HEAD
    path: apps/code-factory/workers
    directory:
      recurse: true
      # Scaffolds not deployed yet: their images (built by artieeez/pr-assistant-worker and
      # artieeez/cf-sdd-worker) don't exist and their cf-worker-<workflow> Secrets aren't sealed.
      # Remove a folder from this list in the commit that adds its sealed Secret
      # (apps/code-factory/README.md "Adding a worker").
      exclude: '{pr-assistant/*,sdd/*}'
  destination:
    server: https://kubernetes.default.svc
    namespace: code-factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
