  # IMPORTANT: grafana chart `alerting` values must be maps (not `|` strings)  - hasKey/tpl in _config.tpl.
  # Go templates for Slack titles use Helm raw strings so tpl leaves them for Grafana.
  alerting:
    sitio-rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: sitio-rails
          folder: Sitio
          interval: 1m
          rules:
            - uid: sitio-staging-wix-integration-error
              title: SitioRailsWixIntegrationErrorStaging
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: loki
                  model:
                    datasource:
                      type: loki
                      uid: loki
                    editorMode: code
                    expr: 'sum(count_over_time({service_name="sitio-rails", service_namespace="sitio-staging"} | json | attributes_event=~"wix\\.(event_failed|webhook_rejected|api_error|payment_sync_skipped)" [5m]))'
                    queryType: instant
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: []
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    reducer: last
                    refId: B
                    type: reduce
                - refId: C
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 0
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - C
                        reducer:
                          params: []
                          type: last
                        type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: B
                    refId: C
                    type: threshold
              noDataState: OK
              execErrState: Error
              for: 1m
              annotations:
                summary: Wix integration error in sitio-staging
                description: At least one wix.event_failed, wix.webhook_rejected, wix.api_error, or wix.payment_sync_skipped in 5m (sitio-staging).
              labels:
                severity: warning
                team: sitio
                env: staging

