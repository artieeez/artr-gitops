crds:
  enabled: false

additionalPrometheusRulesMap:
  cert-manager:
    groups:
      - name: cert-manager
        rules:
          - alert: CertManagerCertificateNotReady
            expr: |
              max by (name, namespace) (
                certmanager_certificate_ready_status{condition="False"} == 1
              )
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Certificate {{ $labels.name }} in {{ $labels.namespace }} is not Ready"
              description: "cert-manager has not issued or renewed this certificate for 15+ minutes. Check ACME challenges and Cloudflare token."
          - alert: CertManagerCertificateExpirySoon
            expr: |
              (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 < 21
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Certificate {{ $labels.name }} in {{ $labels.namespace }} expires in {{ $value | humanize }} days"
              description: "Renewal should happen automatically ~30 days before expiry. Investigate if this persists."
  sitio-rails-sqlite-backup:
    groups:
      - name: sitio-rails-sqlite-backup
        rules:
          - alert: SitioRailsSqliteBackupJobFailed
            expr: |
              (
                kube_job_status_failed{namespace=~"sitio-staging|sitio-production"} > 0
              )
              * on(namespace, job_name) group_left(owner_name)
              (
                kube_job_owner{
                  namespace=~"sitio-staging|sitio-production",
                  owner_kind="CronJob",
                  owner_name="sitio-rails-sqlite-backup"
                }
              )
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Sitio SQLite backup Job failed in {{ $labels.namespace }}"
              description: "Job {{ $labels.job_name }} from CronJob sitio-rails-sqlite-backup failed. Check logs and docs/sqlite-backup-runbook.md (Failed Job / disk / credentials)."
          - alert: SitioRailsSqliteBackupMissedSchedule
            expr: |
              (
                time() - kube_cronjob_status_last_successful_time{
                  namespace=~"sitio-staging|sitio-production",
                  cronjob="sitio-rails-sqlite-backup"
                }
              ) > 30 * 3600
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Sitio SQLite backup missed schedule in {{ $labels.namespace }}"
              description: "CronJob sitio-rails-sqlite-backup has no successful run in ~30h. Check suspended CronJob, node disk pressure, or Failed Jobs  - docs/sqlite-backup-runbook.md."

prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-client
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

alertmanager:
  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/slack-api-url
    inhibit_rules:
      - equal:
          - namespace
          - alertname
        source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
      - equal:
          - namespace
          - alertname
        source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
      - equal:
          - namespace
        source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
      - target_matchers:
          - alertname = InfoInhibitor
    route:
      receiver: "null"
      group_by:
        - namespace
        - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: slack-infra
          matchers:
            - alertname =~ "CertManager.*|Tls.*|SitioRailsSqliteBackup.*"
          group_by:
            - alertname
            - namespace
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          continue: false
        - receiver: "null"
          matchers:
            - alertname = Watchdog
    receivers:
      - name: "null"
      - name: slack-infra
        slack_configs:
          - send_resolved: true
            title: '{{ if eq .Status "firing" }}:rotating_light:{{ else }}:white_check_mark:{{ end }} {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}
              *{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ if .Labels.namespace }}namespace: `{{ .Labels.namespace }}`{{ end }}{{ if .Labels.name }} · cert: `{{ .Labels.name }}`{{ end }}
              {{ end }}
            color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'
  alertmanagerSpec:
    secrets:
      - alertmanager-slack-webhook
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-client
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

