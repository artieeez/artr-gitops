  # Grafana Unified Alerting — Sitio LogQL rules. Slack contact point: see docs/sitio-observability.md
  alerting:
    sitio-rules.yaml: |
      apiVersion: 1
      groups:
        - orgId: 1
          name: sitio-rails
          folder: Sitio
          interval: 1m
          rules:
            - uid: sitio-wix-event-failed-sustained
              title: SitioRailsWixEventFailedSustained
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 900
                    to: 0
                  datasourceUid: loki
                  model:
                    datasource:
                      type: loki
                      uid: loki
                    editorMode: code
                    expr: sum(count_over_time({service_name="sitio-rails"} | json | event="wix.event_failed" [15m]))
                    queryType: instant
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 900
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: []
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    reducer: last
                    refId: B
                    type: reduce
                - refId: C
                  relativeTimeRange:
                    from: 900
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 3
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - C
                        reducer:
                          params: []
                          type: last
                        type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: B
                    refId: C
                    type: threshold
              noDataState: OK
              execErrState: Error
              for: 15m
              annotations:
                summary: Sustained Wix event processing failures in sitio-rails
                description: More than 3 wix.event_failed events in 15m for 15m.
              labels:
                severity: warning
                team: sitio
            - uid: sitio-share-link-denial-spike
              title: SitioRailsShareLinkDenialSpike
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: loki
                  model:
                    datasource:
                      type: loki
                      uid: loki
                    editorMode: code
                    expr: sum(count_over_time({service_name="sitio-rails"} | json | event="share_link.denied" [10m]))
                    queryType: instant
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: []
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    reducer: last
                    refId: B
                    type: reduce
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 20
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - C
                        reducer:
                          params: []
                          type: last
                        type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: B
                    refId: C
                    type: threshold
              noDataState: OK
              execErrState: Error
              for: 10m
              annotations:
                summary: Share-link denial spike in sitio-rails
                description: More than 20 share_link.denied events in 10m for 10m.
              labels:
                severity: warning
                team: sitio
    sitio-contactpoints.yaml: |
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: slack-sitio
          receivers:
            - uid: slack-sitio
              type: slack
              settings:
                url: ${SITIO_GRAFANA_SLACK_WEBHOOK_URL}
                title: '{{ .CommonLabels.alertname }}'
                text: '{{ .CommonAnnotations.summary }}\n{{ .CommonAnnotations.description }}'
              disableResolveMessage: false
    sitio-policies.yaml: |
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: slack-sitio
          group_by:
            - grafana_folder
            - alertname
          matchers:
            - team = sitio
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
  # Reuse Alertmanager Slack webhook for Grafana Sitio contact point (env expansion in contactpoints).
  envValueFrom:
    SITIO_GRAFANA_SLACK_WEBHOOK_URL:
      secretKeyRef:
        name: alertmanager-slack-webhook
        key: slack-api-url
  # OIDC client secret from Secret (create via SealedSecret; see apps/monitoring/grafana/README.md)
  envFromSecret: grafana-oidc-secret
  grafana.ini:
    server:
      root_url: https://grafana.artr.com.br
    auth.generic_oauth:
      enabled: true
      name: Pocket ID
      allow_sign_up: true
      # client_id and client_secret from env (Secret grafana-oidc-secret)
      scopes: openid profile email groups
      auth_url: https://pocketid.artr.com.br/authorize
      token_url: https://pocketid.artr.com.br/api/oidc/token
      api_url: https://pocketid.artr.com.br/api/oidc/userinfo
      role_attribute_path: contains(groups[*], 'admin') && 'Admin' || contains(groups[*], 'admin_view_only') && 'Viewer' || 'Viewer'
      allow_assign_grafana_admin: true
  persistence:
    enabled: true
    type: pvc
    storageClassName: nfs-client
    accessModes:
      - ReadWriteOnce
    size: 10Gi
