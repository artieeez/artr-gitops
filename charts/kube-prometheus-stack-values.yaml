    sitio-contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: slack-sitio
          receivers:
            - uid: slack-sitio
              type: slack
              settings:
                url: ${SITIO_GRAFANA_SLACK_WEBHOOK_URL}
                title: '{{`{{ .CommonLabels.alertname }}`}}'
                text: '{{`{{ .CommonAnnotations.summary }}\n{{ .CommonAnnotations.description }}`}}'
              disableResolveMessage: false
    # Root route must have no matchers (Grafana 13). Nest team=sitio under routes.
    sitio-policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: slack-sitio
          group_by:
            - grafana_folder
            - alertname
            - env
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - receiver: slack-sitio
              matchers:
                - team = sitio
              group_by:
                - grafana_folder
                - alertname
                - env
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
  envValueFrom:
    SITIO_GRAFANA_SLACK_WEBHOOK_URL:
      secretKeyRef:
        name: alertmanager-slack-webhook
        key: slack-api-url
  # OIDC client secret from Secret (create via SealedSecret; see apps/monitoring/grafana/README.md)
  envFromSecret: grafana-oidc-secret
  grafana.ini:
    server:
      root_url: https://grafana.artr.com.br
    auth.generic_oauth:
      enabled: true
      name: Pocket ID
      allow_sign_up: true
      # client_id and client_secret from env (Secret grafana-oidc-secret)
      scopes: openid profile email groups
      auth_url: https://pocketid.artr.com.br/authorize
      token_url: https://pocketid.artr.com.br/api/oidc/token
      api_url: https://pocketid.artr.com.br/api/oidc/userinfo
      role_attribute_path: contains(groups[*], 'admin') && 'Admin' || contains(groups[*], 'admin_view_only') && 'Viewer' || 'Viewer'
      allow_assign_grafana_admin: true
  persistence:
    enabled: true
    type: pvc
    storageClassName: nfs-client
    accessModes:
      - ReadWriteOnce
    size: 10Gi
