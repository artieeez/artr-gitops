# Grafana Loki — SingleBinary, filesystem on PVC (aligned with monitoring nfs-client).
# Chart: grafana/loki

# Loki Canary (loki-canary-*) pushes synthetic probe logs to Loki; Grafana may show them as
# unknown_service / noisy streams. Disable unless you rely on canary-based health checks.
lokiCanary:
  enabled: false

# Chart validate.yaml requires canary when test.enabled is true; disable Helm tests if canary is off.
test:
  enabled: false

deploymentMode: SingleBinary

# containerd short-name mode (e.g. OCI) requires fully qualified image references.
memcached:
  image:
    repository: docker.io/library/memcached
    tag: 1.6.45-alpine

memcachedExporter:
  image:
    repository: docker.io/prom/memcached-exporter
    tag: v0.17.0

minio:
  enabled: false

# Default chunks cache uses allocatedMemory 8192 → ~9830Mi requests (too large for small nodes).
chunksCache:
  allocatedMemory: 512
  allocatedCPU: 100m

resultsCache:
  allocatedMemory: 256
  allocatedCPU: 100m

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  # Retention is enforced by the compactor, which in SingleBinary runs inside
  # the same process (target=all) — no separate compactor pod needed.
  # compaction_interval and retention_delete_delay already default to these
  # values; listed to document intent. delete_request_store is mandatory
  # whenever retention is enabled.
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: filesystem
  # Dashboards query with | json, not | pattern; the pattern ingester only costs ~50-150 MiB on loki-0.
  pattern_ingester:
    enabled: false
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    # Bounded retention is what keeps 1Gi on filesystem from filling up now that
    # pod stdout is ingested too. Size math: ~142 MB/day of log bytes after the
    # Alloy drop rules, ~6-13x compression on disk -> 11-24 MiB/day stored, so
    # 14d lands around 185-415 MiB including index. Without retention the same
    # ingest fills the 1Gi volume in 2-6 weeks.
    retention_period: 336h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: nfs-client
    # 1Gi is enough because retention is bounded (see limits_config above).
    # Raising it is cheap and non-disruptive if 14d is too short: the class sets
    # allowVolumeExpansion, and nfs-subdir-external-provisioner enforces no
    # quota anyway (the directory grows inside nfs-server's 50Gi volume).
    size: 1Gi

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
