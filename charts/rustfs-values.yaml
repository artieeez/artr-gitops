# RustFS – TLS at Traefik (IngressRoute in rustfs/), storage on NFS.
# See: https://github.com/rustfs/helm
# Deployed in platform namespace so NFS path is platform/platform-rustfs (pathPattern: ${.PVC.namespace}/${.PVC.name})

fullnameOverride: platform-rustfs

# Fully qualified images (required when cluster enforces short-name resolution, e.g. CRI-O)
image:
  rustfs:
    repository: docker.io/rustfs/rustfs
  initImage:
    repository: docker.io/library/busybox

# Standalone: one pod, one PVC (NFS). Use distributed + replicaCount for multi-pod.
mode:
  standalone:
    enabled: true
  distributed:
    enabled: false

# Storage on NFS (nfs-subdir-external-provisioner → nfs-server)
storageclass:
  name: nfs-client

# Ingress disabled – routing and TLS via IngressRoute (apps/platform/rustfs/ingressroute.yaml)
ingress:
  enabled: false

# Credentials from existing Secret (SealedSecret in rustfs/rustfs-credentials-sealed.yaml)
# Secret must have keys: RUSTFS_ACCESS_KEY, RUSTFS_SECRET_KEY
secret:
  existingSecret: rustfs-credentials

# Log retention (ART-70): rustfs rotates hourly and gzips, but never prunes — /logs
# had grown to 6.4 GiB (~6700 files since March). keep_files caps the rotated
# history at 30 files (~1.5 MiB/hour → ~45 MiB).
config:
  rustfs:
    log_rotation:
      keep_files: 30
