service:
  enabled: true
  spec:
    type: NodePort
ports:
  web:
    expose:
      default: true
    nodePort: 32080
  websecure:
    expose:
      default: true
    nodePort: 32443
# Pi-hole DNS is not proxied by Traefik: it is reached over the tailnet
# (pihole-dns.<tailnet>.ts.net) and the OCI NLB no longer publishes 53/853.
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
api:
  dashboard: true
  insecure: true
log:
  level: INFO
