# OCI Customer Secret Key for S3-compatible backup uploads (sitio-rails sqlite backup).
# Display name in OCI: sitio-rails-sqlite-backup
# Reseal after key rotation — see docs/sealed-secrets.md
#
# Recreate plaintext (do not commit):
# kubectl -n sitio-production create secret generic s3-credentials \
#   --from-literal=access-key-id='…' \
#   --from-literal=secret-access-key='…' \
#   --dry-run=client -o yaml | \
# kubeseal --format yaml --controller-namespace sealed-secrets --controller-name sealed-secrets \
#   > apps/sitio-production/sitio-rails-backup/s3-credentials-sealed.yaml

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: s3-credentials
  namespace: sitio-production
spec:
  encryptedData:
    access-key-id: 
    secret-access-key: 
  template:
    metadata:
      name: s3-credentials
      namespace: sitio-production
