# code-factory server (NestJS, apps/server). One replica: the engine's sweeps and leases
# assume a single server. Migrations run in the init container from the same image.
# Image tag bumped by artieeez/code-factory .github/workflows/deploy.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cf-server
  namespace: code-factory
  labels:
    app: cf-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cf-server
  template:
    metadata:
      labels:
        app: cf-server
      annotations:
        # a pod reads its env and Secret cf-server only at start, and nothing restarts it when
        # the Secret changes: bump this in the commit that changes it
        code-factory/config-rev: "6"
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ocir-pull
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: migrate
          image: vcp.ocir.io/axtvnrdemzo7/cf-server:sha-19f09fd
          imagePullPolicy: IfNotPresent
          command: ["node_modules/.bin/prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cf-postgres
                  key: url
      containers:
        - name: server
          image: vcp.ocir.io/axtvnrdemzo7/cf-server:sha-19f09fd
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4400
          envFrom:
            # CF_SECRETS_KEY, GITHUB_*, LINEAR_* (the plugins' env instances, AD-089)
            - secretRef:
                name: cf-server
          # The server reads no config file (code-factory AD-089): sign-in and the plugins'
          # default instances come from env; workflow bindings and settings from the dashboard.
          env:
            - name: CF_PUBLIC_URL
              value: https://factory.artr.com.br
            # the image sets CF_HOST=0.0.0.0, which the server refuses without CF_OIDC_ISSUER
            - name: CF_OIDC_ISSUER
              value: https://pocketid.artr.com.br
            - name: CF_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cf-server
                  key: OIDC_CLIENT_ID
            - name: CF_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cf-server
                  key: OIDC_CLIENT_SECRET
            - name: CF_OIDC_ADMIN_GROUPS
              value: admin
            - name: CF_OIDC_OPERATOR_GROUPS
              value: admin
            - name: CF_OIDC_VIEWER_GROUPS
              value: admin_view_only
            # webhooks at https://factory.artr.com.br/hooks/<github|linear>/<token>
            - name: CF_GITHUB_HOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cf-server
                  key: GITHUB_HOOK_TOKEN
            - name: CF_LINEAR_HOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cf-server
                  key: LINEAR_HOOK_TOKEN
            # the env GitHub instance's repos (comma-separated); the rest of GITHUB_* is in cf-server
            - name: GITHUB_REPOS
              value: artieeez/code-factory,artieeez/cf-playground-dashboard
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cf-postgres
                  key: url
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/cf
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cf-server-data
