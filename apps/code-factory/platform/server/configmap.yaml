# factory.yaml (AD-013): `${ENV}` values come from the server's env (Secret cf-server).
# The plugin instances and workflow bindings are commented out until their secrets are
# sealed into cf-server: the server stops at start when an instance's secret is missing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cf-factory
  namespace: code-factory
data:
  factory.yaml: |
    auth:
      oidc:
        issuer: https://pocketid.artr.com.br
        clientId: ${OIDC_CLIENT_ID}
        clientSecret: ${OIDC_CLIENT_SECRET}
        rolesClaim: groups
        roles:
          admin: [admin]
          operator: [admin]
          viewer: [admin_view_only]
    # plugins:
