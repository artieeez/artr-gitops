# factory.yaml (AD-013): `${ENV}` values come from the server's env (Secret cf-server).
# A plugin instance or workflow binding stays commented out until its secrets are sealed
# into cf-server: the server stops at start when an instance's secret is missing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cf-factory
  namespace: code-factory
data:
  factory.yaml: |
    auth:
      oidc:
        issuer: https://pocketid.artr.com.br
        clientId: ${OIDC_CLIENT_ID}
        clientSecret: ${OIDC_CLIENT_SECRET}
        rolesClaim: groups
        roles:
          admin: [admin]
          operator: [admin]
          viewer: [admin_view_only]
    plugins:
      # GitHub App artr-code-factory (artieeez), installed on artieeez/code-factory only;
      # webhook https://factory.artr.com.br/hooks/github/<hookToken>
      github:
        plugin: github@0.1
        hookToken: ${GITHUB_HOOK_TOKEN}
        config:
          appId: ${GITHUB_APP_ID}
          installationId: ${GITHUB_INSTALLATION_ID}
          # the App's slug: deliveries sent by <appSlug>[bot] give no event (AD-075)
          appSlug: ${GITHUB_APP_SLUG}
          repos: [artieeez/code-factory]
      # Linear team ART (workspace artur-webber); webhook "code-factory dogfood" (Issue,
      # Comment) to https://factory.artr.com.br/hooks/linear/<hookToken>
      linear:
        plugin: linear@0.1
        hookToken: ${LINEAR_HOOK_TOKEN}
        config: { team: ${LINEAR_TEAM} }
    workflows:
      dogfood:
        bind: { tracker: linear, forge: github }
        # the defaults, spelled out; states and the repo are checked against Linear and GitHub
        # at register
        settings:
          ready: Factory
          working: In Progress
          review: In Review
          done: Done
          abandoned: Canceled
          repo: artieeez/code-factory
          base: main
      pr-review:
        bind: { forge: github }
        settings:
          repo: artieeez/code-factory
