# sdd worker (artieeez/cf-sdd-worker): workflow sdd, Linear issue in `Spec` → spec → approval →
# build → verify → PR on the playground repo. NOT SYNCED YET: argocd/applications/code-factory-workers.yaml
# excludes this folder until the cf-worker-sdd Secret is sealed (README "Adding a worker").
# Agents run Claude Code with the server's agent accounts. No Postgres sidecar: the playground's
# checks use no database.
# A StatefulSet with a volume per pod, like dogfood (code-factory AD-076): a restarted pod
# keeps its name and its run folders. The volume also holds pnpm's store (/var/cf/cache/pnpm-store).
# The image sets CF_WORKSPACE_ROOT=/var/cf/work and CF_AGENT_RUNNER=claude-code.
# Image tag bumped by artieeez/cf-sdd-worker's Deploy workflow (when GITOPS_BUMP=true):
# keep the `image:` lines below. sha-0000000 is a placeholder until then.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cf-worker-sdd
  namespace: code-factory
  labels:
    app: cf-worker-sdd
spec:
  serviceName: cf-worker-sdd
  # dogfood runs 2 (one per node); start with 1 and raise once the nodes have room
  replicas: 1
  selector:
    matchLabels:
      app: cf-worker-sdd
  template:
    metadata:
      labels:
        app: cf-worker-sdd
    spec:
      automountServiceAccountToken: false
      # at most one replica per node
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: cf-worker-sdd
      imagePullSecrets:
        - name: ocir-pull
      # a unit's agent may run for a while: give it time to settle before the pod goes
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: init-workspace
          image: vcp.ocir.io/axtvnrdemzo7/cf-worker-sdd:sha-0000000
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /var/cf/data/work /var/cf/data/cache && chown 1000:1000 /var/cf/data/work /var/cf/data/cache"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/cf/data
      containers:
        - name: worker
          image: vcp.ocir.io/axtvnrdemzo7/cf-worker-sdd:sha-0000000
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 4500
          envFrom:
            # CF_WORKER_TOKEN (the worker holds no GitHub key: the server mints tokens, AD-072)
            - secretRef:
                name: cf-worker-sdd
          env:
            - name: CF_SERVER
              value: http://cf-server.code-factory.svc.cluster.local:4400
            # run links in the PR body and on the Linear issue
            - name: CF_DASHBOARD_URL
              value: https://factory.artr.com.br
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 6Gi
          volumeMounts:
            - name: data
              mountPath: /var/cf/work
              subPath: work
            - name: data
              mountPath: /var/cf/cache
              subPath: cache
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: nfs-client
        resources:
          requests:
            # run folders and pnpm's store; 20Gi (dogfood) is more than sdd needs
            storage: 5Gi
---
# the StatefulSet's governing Service (headless; nothing calls the workers)
apiVersion: v1
kind: Service
metadata:
  name: cf-worker-sdd
  namespace: code-factory
  labels:
    app: cf-worker-sdd
spec:
  clusterIP: None
  selector:
    app: cf-worker-sdd
  ports:
    - name: health
      port: 4500
      targetPort: health
