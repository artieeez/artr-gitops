# pr-assistant worker (artieeez/pr-assistant-worker): workflows pr-review and pr-answer on the
# repos in their `repos` setting (dashboard). NOT SYNCED YET: argocd/applications/code-factory-workers.yaml
# excludes this folder until the cf-worker-pr-assistant Secret is sealed (README "Adding a worker").
# Agents run Claude Code with the server's agent accounts and only read code, so no Postgres sidecar.
# A StatefulSet with a volume per pod, like dogfood (code-factory AD-076): a restarted pod
# keeps its name and its run folders.
# The image sets CF_WORKSPACE_ROOT=/var/cf/work, CF_HEALTH_PORT=4500 and CF_AGENT_RUNNER=claude-code.
# Image tag bumped by artieeez/pr-assistant-worker's Deploy workflow (when GITOPS_BUMP=true):
# keep the `image:` lines below.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cf-worker-pr-assistant
  namespace: code-factory
  labels:
    app: cf-worker-pr-assistant
spec:
  serviceName: cf-worker-pr-assistant
  # dogfood runs 2 (one per node); start with 1 and raise once the nodes have room
  replicas: 1
  selector:
    matchLabels:
      app: cf-worker-pr-assistant
  template:
    metadata:
      labels:
        app: cf-worker-pr-assistant
    spec:
      automountServiceAccountToken: false
      # at most one replica per node
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: cf-worker-pr-assistant
      imagePullSecrets:
        - name: ocir-pull
      # a unit's agent may run for a while: give it time to settle before the pod goes
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: init-workspace
          image: vcp.ocir.io/axtvnrdemzo7/cf-worker-pr-assistant:sha-bb183cf
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /var/cf/data/work /var/cf/data/cache && chown 1000:1000 /var/cf/data/work /var/cf/data/cache"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/cf/data
      containers:
        - name: worker
          image: vcp.ocir.io/axtvnrdemzo7/cf-worker-pr-assistant:sha-bb183cf
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 4500
          envFrom:
            # CF_WORKER_TOKEN (the worker holds no GitHub key: the server mints tokens, AD-072)
            - secretRef:
                name: cf-worker-pr-assistant
          env:
            - name: CF_SERVER
              value: http://cf-server.code-factory.svc.cluster.local:4400
            # run links in the workflows' PR comments
            - name: CF_DASHBOARD_URL
              value: https://factory.artr.com.br
            # policy concurrency is 2, and a run's lenses and skeptics only run side by side
            # with more than one slot
            - name: CF_WORKER_SLOTS
              value: "2"
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 6Gi
          volumeMounts:
            - name: data
              mountPath: /var/cf/work
              subPath: work
            - name: data
              mountPath: /var/cf/cache
              subPath: cache
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: nfs-client
        resources:
          requests:
            storage: 20Gi
---
# the StatefulSet's governing Service (headless; nothing calls the workers)
apiVersion: v1
kind: Service
metadata:
  name: cf-worker-pr-assistant
  namespace: code-factory
  labels:
    app: cf-worker-pr-assistant
spec:
  clusterIP: None
  selector:
    app: cf-worker-pr-assistant
  ports:
    - name: health
      port: 4500
      targetPort: health
