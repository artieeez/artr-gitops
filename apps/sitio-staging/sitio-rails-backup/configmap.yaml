# Generated from scripts/ — regenerate when the scripts change.
apiVersion: v1
data:
  backup.sh: |
    #!/usr/bin/env bash
    # Nightly SQLite backup: VACUUM INTO → gzip → aws s3 cp to OCI Object Storage.
    set -euo pipefail
    
    : "${BACKUP_ENV:?BACKUP_ENV required}"
    : "${BUCKET:?BUCKET required}"
    : "${SQLITE_PATH:?SQLITE_PATH required}"
    
    # OCI Object Storage rejects AWS CLI v2 default flexible checksums (aws-chunked PutObject).
    export AWS_REQUEST_CHECKSUM_CALCULATION="${AWS_REQUEST_CHECKSUM_CALCULATION:-when_required}"
    export AWS_RESPONSE_CHECKSUM_VALIDATION="${AWS_RESPONSE_CHECKSUM_VALIDATION:-when_required}"
    
    WORK_DIR="${TMPDIR:-/tmp}"
    TMP_DB="${WORK_DIR}/sitio-backup-$$.sqlite3"
    TMP_GZ="${WORK_DIR}/sitio-backup-$$.sqlite3.gz"
    
    cleanup() {
      rm -f "${TMP_DB}" "${TMP_GZ}"
    }
    trap cleanup EXIT
    
    if [[ ! -f "${SQLITE_PATH}" ]]; then
      echo "ERROR: source database not found: ${SQLITE_PATH}" >&2
      exit 1
    fi
    
    if [[ ! -s "${SQLITE_PATH}" ]]; then
      echo "ERROR: source database is empty: ${SQLITE_PATH}" >&2
      exit 1
    fi
    
    sqlite3 "${SQLITE_PATH}" "VACUUM INTO '${TMP_DB}'"
    gzip -c "${TMP_DB}" > "${TMP_GZ}"
    
    if [[ ! -s "${TMP_GZ}" ]]; then
      echo "ERROR: compressed backup is empty" >&2
      exit 1
    fi
    
    UTC_TS="$(date -u +%Y%m%dT%H%M%SZ)"
    OBJECT_KEY="${BACKUP_ENV}/sitio-rails/production-${UTC_TS}.sqlite3.gz"
    S3_URI="s3://${BUCKET}/${OBJECT_KEY}"
    
    aws s3 cp "${TMP_GZ}" "${S3_URI}"
    
    echo "Uploaded ${S3_URI}"
  verify.sh: |
    #!/usr/bin/env bash
    # Download backup object and run PRAGMA integrity_check (does not touch live DB PVC).
    set -euo pipefail
    
    : "${OBJECT_KEY:?OBJECT_KEY required (e.g. staging/sitio-rails/production-20260101T060000Z.sqlite3.gz)}"
    : "${BUCKET:?BUCKET required}"
    
    # Match backup.sh — keep aws s3 downloads compatible with OCI Object Storage.
    export AWS_REQUEST_CHECKSUM_CALCULATION="${AWS_REQUEST_CHECKSUM_CALCULATION:-when_required}"
    export AWS_RESPONSE_CHECKSUM_VALIDATION="${AWS_RESPONSE_CHECKSUM_VALIDATION:-when_required}"
    
    WORK_DIR="${TMPDIR:-/tmp}"
    TMP_GZ="${WORK_DIR}/sitio-verify-$$.sqlite3.gz"
    TMP_DB="${WORK_DIR}/sitio-verify-$$.sqlite3"
    
    cleanup() {
      rm -f "${TMP_GZ}" "${TMP_DB}"
    }
    trap cleanup EXIT
    
    S3_URI="s3://${BUCKET}/${OBJECT_KEY}"
    
    aws s3 cp "${S3_URI}" "${TMP_GZ}"
    
    if [[ ! -s "${TMP_GZ}" ]]; then
      echo "ERROR: downloaded object is empty" >&2
      exit 1
    fi
    
    gunzip -c "${TMP_GZ}" > "${TMP_DB}"
    
    result="$(sqlite3 "${TMP_DB}" "PRAGMA integrity_check;")"
    if [[ "${result}" != "ok" ]]; then
      echo "ERROR: integrity_check failed: ${result}" >&2
      exit 1
    fi
    
    echo "OK: integrity_check passed for s3://${BUCKET}/${OBJECT_KEY}"
kind: ConfigMap
metadata:
  name: sitio-rails-backup-scripts
  namespace: sitio-staging
  labels:
    app: sitio-rails-backup
    environment: sitio-staging
