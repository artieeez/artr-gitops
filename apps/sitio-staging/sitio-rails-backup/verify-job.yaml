# One-shot verify Job: download OBJECT_KEY from OCI and run PRAGMA integrity_check.
# Does not mount the app PVC. Archive object must be restored before download (see runbook).
# Set OBJECT_KEY to the backup object (e.g. staging/sitio-rails/production-20260101T060000Z.sqlite3.gz).
# Rename metadata.name before apply if a prior verify Job already exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: sitio-rails-sqlite-backup-verify
  namespace: sitio-staging
  labels:
    app: sitio-rails-backup
    environment: sitio-staging
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sitio-rails-backup
        environment: sitio-staging
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: amazon/aws-cli:2.27.25
          command:
            - /bin/sh
            - -ec
            - |
              if ! command -v sqlite3 >/dev/null 2>&1; then
                if command -v microdnf >/dev/null 2>&1; then
                  microdnf install -y sqlite
                else
                  yum install -y sqlite
                fi
              fi
              exec /scripts/verify.sh
          env:
            - name: OBJECT_KEY
              value: staging/sitio-rails/production-REPLACE_WITH_UTC_TIMESTAMP.sqlite3.gz
            - name: BUCKET
              value: sitio-production-backups
            - name: AWS_DEFAULT_REGION
              value: sa-vinhedo-1
            - name: AWS_ENDPOINT_URL
              value: https://axtvnrdemzo7.compat.objectstorage.sa-vinhedo-1.oci.customer-oci.com
            - name: TMPDIR
              value: /tmp
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-access-key
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: sitio-rails-backup-scripts
            defaultMode: 0755
        - name: tmp
          emptyDir: {}
