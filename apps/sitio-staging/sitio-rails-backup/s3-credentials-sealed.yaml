# OCI Customer Secret Key for S3-compatible backup uploads.
# OPERATOR MUST RESEAL — encryptedData below is placeholder only and will not unseal.
#
# 1. Create a temporary plain Secret:
# kubectl create secret generic s3-credentials \
#   --namespace sitio-staging \
#   --from-literal=access-key-id='<ACCESS_KEY>' \
#   --from-literal=secret-access-key='<SECRET_KEY>' \
#   --dry-run=client -o yaml > /tmp/s3-credentials.yaml
#
# 2. Seal it (replace cert path with your cluster sealed-secrets cert):
# kubeseal --format=yaml --cert=<path-to-cert> \
#   < /tmp/s3-credentials.yaml \
#   > apps/sitio-staging/sitio-rails-backup/s3-credentials-sealed.yaml
#
# 3. Delete temp file:
# rm /tmp/s3-credentials.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: s3-credentials
  namespace: sitio-staging
spec:
  encryptedData:
    access-key-id: AgPLACEHOLDER_OPERATOR_MUST_RESEAL_WITH_KUBESEAL_BEFORE_DEPLOY==
    secret-access-key: AgPLACEHOLDER_OPERATOR_MUST_RESEAL_WITH_KUBESEAL_BEFORE_DEPLOY==
  template:
    metadata:
      name: s3-credentials
      namespace: sitio-staging
    type: Opaque
