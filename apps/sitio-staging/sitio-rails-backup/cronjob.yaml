apiVersion: batch/v1
kind: CronJob
metadata:
  name: sitio-rails-sqlite-backup
  namespace: sitio-staging
  labels:
    app: sitio-rails-backup
    environment: sitio-staging
spec:
  # 30 min after production's 06:00 UTC slot: both Jobs run on the
  # same node, and installing packages in the same minute multiplies
  # the peak memory and disk churn. See docs/sqlite-backup-runbook.md
  # (Resource sizing and OOM).
  schedule: "30 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Self-clean finished Jobs after 7 days. History limits miss drill Jobs
      # created via `kubectl create job --from` (different controller-uid label
      # / no ownerReference); TTL cleanup runs regardless of ownership.
      ttlSecondsAfterFinished: 604800
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: sitio-rails-backup
            environment: sitio-staging
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
          containers:
            - name: backup
              # AL2023: SQLite >= 3.27 (VACUUM INTO). AL2 aws-cli image ships 3.7.17.
              # The runtime `dnf install` below (not the database) is the
              # memory/disk hotspot: ~400 MiB peak, 128-516 MiB of node
              # disk writes, 85 packages per run. A prebuilt image with
              # sqlite/awscli/gzip baked in is the durable fix -- see
              # docs/sqlite-backup-runbook.md (Resource sizing and OOM).
              image: public.ecr.aws/amazonlinux/amazonlinux:2023
              command:
                - /bin/sh
                - -ec
                - |
                  dnf install -y -q sqlite awscli gzip
                  exec /scripts/backup.sh
              env:
                - name: BACKUP_ENV
                  value: staging
                - name: SQLITE_PATH
                  value: /rails/storage/production.sqlite3
                - name: BUCKET
                  value: sitio-production-backups
                - name: AWS_DEFAULT_REGION
                  value: sa-vinhedo-1
                - name: AWS_ENDPOINT_URL
                  value: https://axtvnrdemzo7.compat.objectstorage.sa-vinhedo-1.oci.customer-oci.com
                - name: TMPDIR
                  value: /tmp
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-credentials
                      key: secret-access-key
              resources:
                # Successful runs peak at 357-429 MiB working set (RSS
                # up to 409 MiB) while `dnf install` unpacks packages,
                # then drop to ~105 MiB for the backup itself. The old
                # 512Mi limit left <20% headroom and the container was
                # OOMKilled (exit 137). Requests track the real
                # footprint, so the Job is not the first eviction
                # candidate under node memory pressure.
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              volumeMounts:
                - name: sqlite-data
                  mountPath: /rails/storage
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: sqlite-data
              persistentVolumeClaim:
                claimName: sitio-rails-sqlite
            - name: scripts
              configMap:
                name: sitio-rails-backup-scripts
                defaultMode: 0755
            - name: tmp
              emptyDir: {}
