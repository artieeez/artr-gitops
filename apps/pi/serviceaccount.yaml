# In-cluster admin identity for the pi box's kubectl.
# Full cluster-admin (same power as the owner's local kubectl on this personal
# cluster). Scope down to a read-only ClusterRole if you prefer.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pi-admin
  namespace: pi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pi-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: pi-admin
    namespace: pi