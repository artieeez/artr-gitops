apiVersion: apps/v1
kind: Deployment
metadata:
  name: home
  namespace: staging
  labels:
    app: home
    environment: staging
spec:
  # SQLite single-writer — never scale above 1.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home
  template:
    metadata:
      labels:
        app: home
        environment: staging
    spec:
      imagePullSecrets:
        - name: ocir-pull
      securityContext:
        fsGroup: 1000
      containers:
        - name: home
          # Bumped by home GitHub Action (Build and push OCIR).
          image: vcp.ocir.io/axtvnrdemzo7/home:sha-1fda147
          imagePullPolicy: Always
          ports:
            # Thruster defaults to :80; non-root (UID 1000) cannot bind privileged ports.
            - containerPort: 8080
              name: http
          env:
            - name: RAILS_ENV
              value: production
            - name: HTTP_PORT
              value: "8080"
            - name: APP_BASE_URL
              value: https://home-staging.artr.com.br
            - name: SOLID_QUEUE_IN_PUMA
              value: "true"
            - name: SQLITE_DATABASE
              value: /rails/storage/production.sqlite3
            - name: SQLITE_CACHE_DATABASE
              value: /rails/storage/production_cache.sqlite3
            - name: SQLITE_QUEUE_DATABASE
              value: /rails/storage/production_queue.sqlite3
            - name: SQLITE_CABLE_DATABASE
              value: /rails/storage/production_cable.sqlite3
            - name: RAILS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: home-secrets
                  key: RAILS_MASTER_KEY
            - name: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: home-secrets
                  key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
            - name: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: home-secrets
                  key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
            - name: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: home-secrets
                  key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
            # git-sync publishes the KB under this symlink (see sidecar --link).
            - name: KNOWLEDGE_BASE_PATH
              value: /rails/knowledge/current
            # Sibling of `current`; written by git-sync exechook (sha + subject).
            - name: KNOWLEDGE_BASE_SYNC_STATUS_PATH
              value: /rails/knowledge/synced.json
          volumeMounts:
            - name: sqlite-data
              mountPath: /rails/storage
            - name: knowledge-base
              mountPath: /rails/knowledge
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          args:
            - --repo=git@github.com:artieeez/home-knowledge.git
            - --ref=main
            - --root=/git
            - --link=current
            - --period=60s
            - --depth=1
            - --ssh-known-hosts=true
            - --group-write=true
            - --exechook-command=/hooks/write-synced-status.sh
          volumeMounts:
            - name: knowledge-base
              mountPath: /git
            - name: kb-git-credentials
              mountPath: /etc/git-secret
              readOnly: true
            - name: git-sync-hooks
              mountPath: /hooks
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: home-sqlite
        - name: knowledge-base
          emptyDir: {}
        - name: kb-git-credentials
          secret:
            secretName: home-kb-git
            defaultMode: 0400
        - name: git-sync-hooks
          configMap:
            name: home-git-sync-hooks
            defaultMode: 0755
