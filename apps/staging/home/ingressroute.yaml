# Public portfolio + /up; TinyAuth only on Admin (ADR-005).
# Middleware tinyauth-forwardauth lives here; it was moved from apps/<env>/hello-world
# when hello-world was removed (ART-67). Do not delete it — home's /admin route depends on it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tinyauth-forwardauth
  namespace: staging
spec:
  forwardAuth:
    address: http://tinyauth.platform.svc.cluster.local:3000/api/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Email
      - Remote-Name
      - Remote-Groups
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home
  namespace: staging
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`home-staging.artr.com.br`) && PathPrefix(`/admin`)
      kind: Rule
      priority: 100
      middlewares:
        - name: tinyauth-forwardauth
      services:
        - name: home
          port: 80
    - match: Host(`home-staging.artr.com.br`)
      kind: Rule
      priority: 10
      services:
        - name: home
          port: 80
  tls:
    secretName: wildcard-artr-com-br-tls
