apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ddia-labs
  namespace: staging
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ddia.artr.com.br`)
      kind: Rule
      services:
        - name: ddia-labs
          port: 80
  tls:
    secretName: wildcard-artr-com-br-tls
