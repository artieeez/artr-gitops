apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-playerlist
  namespace: games
data:
  # Offline-mode UUIDs, i.e. UUIDv3(MD5) of "OfflinePlayer:<name>". They are NOT
  # the Mojang UUIDs: the server runs with online-mode=false (see deployment.yaml).
  # Do not switch these to the WHITELIST env var -- itzg resolves names through
  # PlayerDB/Mojang and would write the online UUIDs, which never match, and it
  # aborts container startup for names that do not resolve.
  whitelist.json: |
    [
      {
        "uuid": "b1900999-84e4-34e2-ae9f-b1c88776592a",
        "name": "Artur"
      },
      {
        "uuid": "537ed8ad-f09b-32e4-aa83-d069a54c770a",
        "name": "Gee"
      }
    ]
  # Mounted read-only, so `/op` at runtime cannot persist: edit this file instead.
  ops.json: |
    [
      {
        "uuid": "b1900999-84e4-34e2-ae9f-b1c88776592a",
        "name": "Artur",
        "level": 4,
        "bypassesPlayerLimit": false
      }
    ]
