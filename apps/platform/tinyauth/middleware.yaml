# Shared forwardAuth for platform-namespace IngressRoutes (pihole-web).
# Moved here from apps/platform/sealed-secrets-web when that app was removed.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tinyauth-forwardauth
  namespace: platform
spec:
  forwardAuth:
    address: http://tinyauth.platform.svc.cluster.local:3000/api/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Email
      - Remote-Name
      - Remote-Groups
