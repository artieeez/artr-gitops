apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinyauth
  namespace: platform
  labels:
    app: tinyauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tinyauth
  template:
    metadata:
      labels:
        app: tinyauth
    spec:
      containers:
        - name: tinyauth
          image: ghcr.io/steveiliop56/tinyauth:v5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # Core Tinyauth settings (v5-style)
            - name: TINYAUTH_APPURL
              value: "https://tinyauth.artr.com.br"
            # Pocket ID OAuth provider (v5-style, per docs)
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID
              valueFrom:
                secretKeyRef:
                  name: pocketid-credentials
                  key: client-id
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: pocketid-credentials
                  key: client-secret
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL
              value: "https://pocketid.artr.com.br/authorize"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL
              value: "https://pocketid.artr.com.br/api/oidc/token"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL
              value: "https://pocketid.artr.com.br/api/oidc/userinfo"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_REDIRECTURL
              value: "https://tinyauth.artr.com.br/api/oauth/callback/pocketid"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES
              value: "openid email profile groups"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME
              value: "Pocket ID"
            # Access control for Sealed Secrets Web (`sealedsecrets.artr.com.br`)
            # Only users in Pocket ID OIDC group `admin` can access it.
            - name: TINYAUTH_APPS_SEALEDSECRETS_CONFIG_DOMAIN
              value: "secrets.artr.com.br"
            - name: TINYAUTH_APPS_SEALEDSECRETS_OAUTH_GROUPS
              value: "admin"
            # Hermes Agent dashboard (`hermes.artr.com.br`) — admin group only.
            # Hermes' own OIDC login sits behind this (apps/hermes/ingressroute.yaml).
            - name: TINYAUTH_APPS_HERMES_CONFIG_DOMAIN
              value: "hermes.artr.com.br"
            - name: TINYAUTH_APPS_HERMES_OAUTH_GROUPS
              value: "admin"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-tinyauth-data
