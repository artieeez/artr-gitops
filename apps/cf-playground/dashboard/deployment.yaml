# cf-playground dashboard (artieeez/cf-playground-dashboard): a static React SPA behind a
# non-root nginx on 8080. arm64 image; every node is arm64.
# Image tag bumped by artieeez/cf-playground-dashboard's CI: keep the `image:` line below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cf-playground-dashboard
  namespace: cf-playground
  labels:
    app: cf-playground-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cf-playground-dashboard
  template:
    metadata:
      labels:
        app: cf-playground-dashboard
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ocir-pull
      # the image's nginx runs as uid 101
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: dashboard
          image: vcp.ocir.io/axtvnrdemzo7/cf-playground-dashboard:sha-1e62b1a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
