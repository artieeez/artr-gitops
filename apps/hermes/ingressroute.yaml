# hermes.artr.com.br — dashboard: two auth layers, both backed by Pocket ID:
#   1. Tinyauth forwardAuth at Traefik (group `admin`, see TINYAUTH_APPS_HERMES_*
#      in apps/platform/tinyauth/deployment.yaml). Also hides the public
#      /api/status endpoint from the internet.
#   2. Hermes' native self-hosted OIDC (public PKCE client in Pocket ID).
# The dashboard can edit MCP config / run tools, so never drop both layers.
# Hermes Desktop uses a separate tailnet-only route (service-tailnet.yaml).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tinyauth-forwardauth
  namespace: hermes
spec:
  forwardAuth:
    address: http://tinyauth.platform.svc.cluster.local:3000/api/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Email
      - Remote-Name
      - Remote-Groups
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes
  namespace: hermes
spec:
  entryPoints:
    - websecure
  routes:
    # Inbound webhooks (e.g. Linear) can't do a browser SSO login, so this
    # path skips Tinyauth. Hermes is the boundary: per-route HMAC signature
    # (unknown route / bad signature => 404), 30 req/min per route, 1 MB cap.
    # Only /webhooks/ is exposed — the listener's /health stays internal.
    - match: Host(`hermes.artr.com.br`) && PathPrefix(`/webhooks/`)
      kind: Rule
      priority: 100
      services:
        - name: hermes
          port: 8644
    - match: Host(`hermes.artr.com.br`)
      kind: Rule
      priority: 10
      middlewares:
        - name: tinyauth-forwardauth
      services:
        - name: hermes
          port: 9119
  tls:
    secretName: wildcard-artr-com-br-tls
