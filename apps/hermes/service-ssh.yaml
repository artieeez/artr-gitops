# SSH into the claude-box sandbox over the tailnet (Tailscale operator):
#   ssh claude@claude-box.<tailnet>.ts.net   ->  claude-ssh container :2222
# Key-only (scripts/seal-claude-box-ssh.sh). Not exposed outside the tailnet.
apiVersion: v1
kind: Service
metadata:
  name: claude-box-ssh
  namespace: hermes
  labels:
    app: hermes
    environment: hermes
  annotations:
    tailscale.com/hostname: "claude-box"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: hermes
  ports:
    - port: 22
      name: ssh
      targetPort: ssh
