# Hermes Agent (Nous Research) — gateway (Slack, Socket Mode: outbound only)
# + web dashboard on :9119, both supervised by s6 inside one container.
# Sidecar: grafana MCP on 127.0.0.1:8000. kubectl is copied in by an init container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app: hermes
    environment: hermes
spec:
  # Slack Socket Mode allows ONE connection per app token; SQLite on NFS.
  # Never scale above 1.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
        environment: hermes
    spec:
      serviceAccountName: hermes
      # claude-box uses the private pi-cloud image (OCIR).
      imagePullSecrets:
        - name: ocir-pull
      initContainers:
        # Git is the source of truth for config.yaml (see configmap.yaml) and
        # the claude-herdr Hermes skill. Also pre-creates claude-box's subPath
        # dirs owned by 10000 (kubelet would create them root-owned).
        - name: seed-config
          image: docker.io/nousresearch/hermes-agent:v0.23.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cp /config/config.yaml /opt/data/config.yaml
              mkdir -p /opt/data/skills/claude-herdr /opt/data/claude-home /opt/data/workspace
              cp /claude-box-config/SKILL.md /opt/data/skills/claude-herdr/SKILL.md
              chown 10000:10000 /opt/data/config.yaml /opt/data/claude-home /opt/data/workspace
              chown -R 10000:10000 /opt/data/skills/claude-herdr
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /config
              readOnly: true
            - name: claude-box-config
              mountPath: /claude-box-config
              readOnly: true
        # herdr CLI for Hermes, taken from the pi-cloud image (same binary the
        # claude-box server runs). The wrapper points it at the shared socket
        # dir: $XDG_CONFIG_HOME/herdr/herdr.sock = /run/herdr/herdr/herdr.sock.
        - name: herdr-cli
          image: vcp.ocir.io/axtvnrdemzo7/pi-cloud:sha-aef05ea
          # pi-cloud's WORKDIR is /root/artieeez (root-only); as UID 10000
          # git/herdr fail to stat it, so start somewhere we own.
          workingDir: /tools
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cp "$(command -v herdr)" /tools/herdr-bin
              printf '#!/bin/sh\nexport XDG_CONFIG_HOME=/run/herdr\nexec /opt/tools/herdr-bin "$@"\n' > /tools/herdr
              chmod 0755 /tools/herdr-bin /tools/herdr
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          volumeMounts:
            - name: tools
              mountPath: /tools
        # Claude Code (native build, version pinned below; reinstalled only
        # when the pin changes) + personal Claude config from
        # artieeez/claude-config (/split, herdr hooks, settings) + first-run
        # flags so interactive `claude` never waits on an onboarding screen.
        - name: claude-install
          image: vcp.ocir.io/axtvnrdemzo7/pi-cloud:sha-aef05ea
          # pi-cloud's WORKDIR is /root/artieeez (root-only); as UID 10000
          # git/herdr fail to stat it, so start somewhere we own.
          workingDir: /opt/data/claude-home
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              export PATH="$HOME/.local/bin:$PATH"
              have="$(claude --version 2>/dev/null | awk '{print $1}' || true)"
              if [ "$have" != "$CLAUDE_CODE_VERSION" ]; then
                curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
              fi
              # git/gh over HTTPS with GH_TOKEN (credential helper = gh, token stays in env)
              gh auth setup-git
              git config --global user.name "artieeez"
              git config --global user.email "artieeez@users.noreply.github.com"
              git config --global init.defaultBranch main
              # personal Claude config: tracked files only; runtime state
              # (projects/, sessions, history) is ignored by its .gitignore
              mkdir -p "$HOME/.claude" && cd "$HOME/.claude"
              [ -d .git ] || { git init -q -b main && git remote add origin https://github.com/artieeez/claude-config.git; }
              git fetch -q --depth 1 origin main
              git checkout -q -f -B main FETCH_HEAD
              # skip first-run onboarding (keeps other ~/.claude.json state)
              [ -s "$HOME/.claude.json" ] || echo '{}' > "$HOME/.claude.json"
              jq '.hasCompletedOnboarding = true | .theme = (.theme // "dark")' "$HOME/.claude.json" > "$HOME/.claude.json.tmp"
              mv "$HOME/.claude.json.tmp" "$HOME/.claude.json"
              # login-shell panes reset PATH via /etc/profile: re-add ~/.local/bin
              # herdr config: panes must be bash LOGIN shells so /etc/profile.d
              # gives them the pi-cloud toolchain. Append only if missing — herdr
              # owns the rest of this file (onboarding, keybindings).
              HDR_CONFIG="$HOME/.config/herdr/config.toml"
              mkdir -p "$(dirname "$HDR_CONFIG")"
              herdr-pane-config "$HDR_CONFIG" || echo "WARN: herdr-pane-config failed; panes may be non-login shells"
              # SSH (claude-ssh container): sshd refuses group/world-readable
              # keys, so copy the sealed ones (mounted 0444) to 0600 copies.
              install -d -m 700 "$HOME/.sshd" "$HOME/.ssh"
              install -m 600 /claude-box-ssh/ssh_host_ed25519_key "$HOME/.sshd/ssh_host_ed25519_key"
              install -m 644 /claude-box-ssh/ssh_host_ed25519_key.pub "$HOME/.sshd/ssh_host_ed25519_key.pub"
              install -m 600 /claude-box-ssh/authorized_keys "$HOME/.ssh/authorized_keys"
              # UID 10000 has no passwd entry in the image; sshd (and whoami/git)
              # need one. claude-box + claude-ssh mount these over /etc.
              cp /etc/passwd /etc-override/passwd && cp /etc/group /etc-override/group
              echo "claude:x:10000:10000:Claude (hermes claude-box):/opt/data/claude-home:/bin/bash" >> /etc-override/passwd
              echo "claude:x:10000:" >> /etc-override/group
              # Login-shell panes reset PATH via /etc/profile: ~/.profile sources
              # this file (regenerated every boot) to re-add claude + gem bins.
              printf 'export PATH="$HOME/.local/bin:$GEM_HOME/bin:$PATH"\n' > "$HOME/.claude-box-env"
              grep -qs 'claude-box-env' "$HOME/.profile" || \
                printf '\n[ -f "$HOME/.claude-box-env" ] && . "$HOME/.claude-box-env"\n' >> "$HOME/.profile"
          env:
            - name: HOME
              value: /opt/data/claude-home
            - name: CLAUDE_CODE_VERSION
              value: "2.1.325"
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GH_TOKEN
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          volumeMounts:
            - name: data
              mountPath: /opt/data/claude-home
              subPath: claude-home
            - name: claude-box-ssh
              mountPath: /claude-box-ssh
              readOnly: true
            - name: etc-override
              mountPath: /etc-override
        # Static kubectl binary for the agent's terminal tool. Uses the pod's
        # ServiceAccount (read-only RBAC, rbac.yaml) via in-cluster config.
        - name: kubectl
          image: docker.io/alpine/kubectl:1.36.4
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - cp "$(command -v kubectl)" /tools/kubectl && chmod 0755 /tools/kubectl
          volumeMounts:
            - name: tools
              mountPath: /tools
      containers:
        - name: hermes
          # Pinned release; bump deliberately (startup runs config migrations).
          image: docker.io/nousresearch/hermes-agent:v0.23.1
          # Immutable version tag => IfNotPresent (docs/image-pull-policy.md).
          imagePullPolicy: IfNotPresent
          args: ["gateway", "run"]
          ports:
            - containerPort: 9119
              name: dashboard
            - containerPort: 8644
              name: webhook
          env:
            - name: HERMES_DASHBOARD
              value: "1"
            # Inbound webhooks (routes managed in the dashboard). Public via
            # https://hermes.artr.com.br/webhooks/<route> (ingressroute.yaml);
            # every route must carry its own secret (HMAC) or requests 404.
            - name: WEBHOOK_ENABLED
              value: "true"
            - name: WEBHOOK_PORT
              value: "8644"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: "https://hermes.artr.com.br"
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: "https://pocketid.artr.com.br"
          # DEEPSEEK_API_KEY, SLACK_*, GH_TOKEN, LINEAR_API_KEY,
          # HERMES_DASHBOARD_OIDC_CLIENT_ID — sealed via scripts/seal-hermes-secrets.sh.
          # Env overrides /opt/data/.env.
          envFrom:
            - secretRef:
                name: hermes-secrets
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tools
              mountPath: /usr/local/bin/kubectl
              subPath: kubectl
              readOnly: true
            # herdr CLI (wrapper -> /opt/tools/herdr-bin) + the socket dir
            # shared with claude-box. See the claude-herdr skill.
            - name: tools
              mountPath: /usr/local/bin/herdr
              subPath: herdr
              readOnly: true
            - name: tools
              mountPath: /opt/tools
              readOnly: true
            - name: herdr-run
              mountPath: /run/herdr
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          # /api/status is the dashboard's public status endpoint (also hidden
          # from the internet by tinyauth). First boot seeds + migrates config.
          startupProbe:
            httpGet:
              path: /api/status
              port: dashboard
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/status
              port: dashboard
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/status
              port: dashboard
            periodSeconds: 10
            timeoutSeconds: 5
        - name: grafana-mcp
          image: docker.io/grafana/mcp-grafana:2.3.0
          imagePullPolicy: IfNotPresent
          # Loopback only: reachable by hermes in this pod, not by the cluster.
          args:
            - --transport
            - streamable-http
            - --address
            - 127.0.0.1:8000
            - --disable-write
          env:
            - name: GRAFANA_URL
              value: "http://monitoring-kube-prometheus-stack-grafana.monitoring.svc.cluster.local"
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GRAFANA_SERVICE_ACCOUNT_TOKEN
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        # Claude Code host: headless herdr server; Hermes drives it over the
        # shared socket (claude-herdr skill). Isolation: only GH_TOKEN + the
        # Claude login in env, and only claude-home/ + workspace/ of the PVC —
        # none of Hermes' keys, state or MCP tokens. Attach to watch/take over:
        #   kubectl -n hermes exec -it deploy/hermes -c claude-box -- herdr
        # pi-cloud image reused for its toolchain (herdr, git, gh, node, Ruby);
        # its entrypoint (sshd, boot sync) is replaced by `herdr server`.
        - name: claude-box
          image: vcp.ocir.io/axtvnrdemzo7/pi-cloud:sha-aef05ea
          # pi-cloud's WORKDIR is /root/artieeez (root-only); as UID 10000
          # git/herdr fail to stat it, so start somewhere we own.
          workingDir: /opt/data/claude-home
          # Immutable sha tag => IfNotPresent (2.2 GiB image).
          imagePullPolicy: IfNotPresent
          command: ["herdr", "server"]
          env:
            - name: HOME
              value: /opt/data/claude-home
            - name: XDG_CONFIG_HOME
              value: /run/herdr
            # Writable (herdr saves onboarding/keybindings here), on the PVC so
            # it survives restarts; claude-install ensures the [terminal] block.
            - name: HERDR_CONFIG_PATH
              value: /opt/data/claude-home/.config/herdr/config.toml
            - name: PATH
              value: /opt/data/claude-home/.local/bin:/opt/data/claude-home/.gem/bin:/opt/mise-root/local/bin:/opt/mise/shims:/opt/nvim/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: SHELL
              value: /bin/bash
            - name: TERM
              value: xterm-256color
            # Ruby: mise's install under /opt/mise is root-owned/read-only, so
            # gems (and Bundler self-updates, e.g. a lockfile's newer Bundler)
            # go to a per-user GEM_HOME, and bundles to ONE shared BUNDLE_PATH:
            # a fresh worktree's `bundle install` reuses already-built gems.
            - name: GEM_HOME
              value: /opt/data/claude-home/.gem
            - name: BUNDLE_PATH
              value: /opt/data/claude-home/.bundle-cache
            - name: BUNDLE_JOBS
              value: "4"
            # Version is pinned by claude-install; never self-update.
            - name: DISABLE_AUTOUPDATER
              value: "1"
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GH_TOKEN
            # `claude setup-token` (subscription) — no browser in the pod.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: CLAUDE_CODE_OAUTH_TOKEN
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          volumeMounts:
            - name: data
              mountPath: /opt/data/claude-home
              subPath: claude-home
            - name: data
              mountPath: /opt/data/workspace
              subPath: workspace
            - name: herdr-run
              mountPath: /run/herdr
            - name: claude-box-config
              mountPath: /etc/claude-code/managed-settings.json
              subPath: managed-settings.json
              readOnly: true
            - name: etc-override
              mountPath: /etc/passwd
              subPath: passwd
              readOnly: true
            - name: etc-override
              mountPath: /etc/group
              subPath: group
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 4Gi
          readinessProbe:
            exec:
              command: ["test", "-S", "/run/herdr/herdr/herdr.sock"]
            initialDelaySeconds: 5
            periodSeconds: 10
        # SSH into the claude-box sandbox over Tailscale (service-ssh.yaml):
        #   ssh claude-box   |   herdr --remote claude-box
        # Non-root sshd (UID 10000, key-only, user `claude`). Shells run here;
        # `herdr` attaches to the claude-box server via the shared socket, so
        # panes still run in claude-box. No secrets in this container's env;
        # sshd_config SetEnv provides the non-secret paths.
        - name: claude-ssh
          image: vcp.ocir.io/axtvnrdemzo7/pi-cloud:sha-aef05ea
          # pi-cloud's WORKDIR is /root/artieeez (root-only); as UID 10000
          # git/herdr fail to stat it, so start somewhere we own.
          workingDir: /opt/data/claude-home
          imagePullPolicy: IfNotPresent
          command: ["/usr/sbin/sshd", "-D", "-e", "-f", "/etc/claude-box/sshd_config"]
          ports:
            - containerPort: 2222
              name: ssh
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          volumeMounts:
            - name: data
              mountPath: /opt/data/claude-home
              subPath: claude-home
            - name: data
              mountPath: /opt/data/workspace
              subPath: workspace
            - name: herdr-run
              mountPath: /run/herdr
            - name: sshd-run
              mountPath: /run/sshd
            - name: claude-box-config
              mountPath: /etc/claude-box/sshd_config
              subPath: sshd_config
              readOnly: true
            - name: etc-override
              mountPath: /etc/passwd
              subPath: passwd
              readOnly: true
            - name: etc-override
              mountPath: /etc/group
              subPath: group
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: herdr-run
          emptyDir: {}
        - name: claude-box-config
          configMap:
            name: claude-box-config
        # authorized_keys + host key (scripts/seal-claude-box-ssh.sh). 0444 so
        # the UID-10000 init can read it; it copies them to 0600 files.
        - name: claude-box-ssh
          secret:
            secretName: claude-box-ssh
            defaultMode: 0444
        - name: etc-override
          emptyDir: {}
        - name: sshd-run
          emptyDir: {}
        - name: config
          configMap:
            name: hermes-config
        - name: tools
          emptyDir: {}
