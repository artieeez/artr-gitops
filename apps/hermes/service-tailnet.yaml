# Hermes Desktop -> dashboard API over the tailnet (Tailscale operator):
#   http://hermes.tailc16433.ts.net  ->  hermes container :9119
# Desktop can't pass Tinyauth's browser forwardAuth, so this path skips it;
# Hermes' own gate still applies (session-token provider for Desktop,
# HERMES_DASHBOARD_SESSION_TOKEN, plus the Pocket ID OIDC login). Plain HTTP
# is fine here: tailnet traffic is WireGuard-encrypted end to end.
# Not exposed outside the tailnet; the public route stays behind Tinyauth.
apiVersion: v1
kind: Service
metadata:
  name: hermes-tailnet
  namespace: hermes
  labels:
    app: hermes
    environment: hermes
  annotations:
    tailscale.com/hostname: "hermes"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: hermes
  ports:
    - port: 80
      name: dashboard
      targetPort: dashboard
