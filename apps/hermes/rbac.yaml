# Read-only cluster identity for the agent's kubectl (debugging).
# Deliberately NOT cluster-admin (unlike apps/pi): this agent is driven from
# Slack. No Secrets, no pods/exec, no write verbs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
  namespace: hermes
  labels:
    app: hermes
    environment: hermes
---
# Built-in `view`: namespaced workloads, pods/log, events, configmaps,
# services, ... across all namespaces. Excludes Secrets by design.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-view
  labels:
    app: hermes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes
---
# What `view` leaves out: cluster-scoped objects, metrics and this cluster's CRDs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-read-extra
  labels:
    app: hermes
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  # ArgoCD apps, Traefik routes, cert-manager certs, SealedSecrets (ciphertext only).
  - apiGroups:
      - argoproj.io
      - traefik.io
      - cert-manager.io
      - acme.cert-manager.io
      - bitnami.com
      - monitoring.coreos.com
      - tailscale.com
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-read-extra
  labels:
    app: hermes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-read-extra
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes
