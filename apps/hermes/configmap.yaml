# Git-managed Hermes config. The `seed-config` init container copies this over
# /opt/data/config.yaml on EVERY boot, so Git is the source of truth: changes
# made via the dashboard / `hermes config set` are lost on restart — port them here.
# Secrets are never written here: ${VAR} is resolved from the env (hermes-secrets).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
  labels:
    app: hermes
    environment: hermes
data:
  config.yaml: |
    model:
      provider: deepseek          # key: DEEPSEEK_API_KEY
      default: deepseek-chat

    # HERMES_HOME is on NFS: WAL needs shared-memory locking NFS can't provide.
    database:
      journal_mode: delete

    dashboard:
      # No public_url on purpose: it would pin the OIDC callback to ONE host,
      # and a login started on the other one fails ("Missing PKCE state
      # cookie" — the cookie lives on the starting host). Unset, Hermes builds
      # /auth/callback from the request (X-Forwarded-* from trusted_proxies):
      #   https://hermes.artr.com.br/auth/callback       (browser, via Traefik)
      #   http://hermes.tailc16433.ts.net/auth/callback  (Desktop, tailnet)
      # Both must be callback URLs on the Pocket ID `hermes` client.
      # Traefik pod network. OKE flannel default is 10.244.0.0/16 — verify with
      # `kubectl get pod -n traefik -o wide` (IP must fall inside this CIDR).
      trusted_proxies:
        - "10.244.0.0/16"
      oauth:
        provider: self-hosted
        self_hosted:
          issuer: https://pocketid.artr.com.br
          # client_id comes from HERMES_DASHBOARD_OIDC_CLIENT_ID (hermes-secrets).
          scopes: "openid profile email groups"

    mcp_servers:
      # Personal GitHub (artieeez) — fine-grained PAT, read + write.
      github:
        url: https://api.githubcopilot.com/mcp/
        headers:
          Authorization: "Bearer ${GH_TOKEN}"
      # Linear — personal API key. If Linear rejects API keys on MCP, drop the
      # header and run the OAuth flow once (token persists on the PVC).
      linear:
        url: https://mcp.linear.app/mcp
        headers:
          Authorization: "Bearer ${LINEAR_API_KEY}"
      # Grafana (dashboards + Prometheus/Loki via datasources) — sidecar in
      # this pod, Viewer service account, write tools disabled.
      grafana:
        url: http://127.0.0.1:8000/mcp
