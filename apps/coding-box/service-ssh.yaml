# SSH into coding-box over the tailnet (Tailscale operator):
#   ssh arturwebber@coding-box.<tailnet>.ts.net   ->  ssh container :2222
# Key-only (scripts/seal-coding-box.sh). Not exposed outside the tailnet.
apiVersion: v1
kind: Service
metadata:
  name: coding-box-ssh
  namespace: coding-box
  labels:
    app: coding-box
  annotations:
    tailscale.com/hostname: "coding-box"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: coding-box
  ports:
    - port: 22
      name: ssh
      targetPort: ssh
