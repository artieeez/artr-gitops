apiVersion: batch/v1
kind: CronJob
metadata:
  name: cert-audit
  namespace: monitoring
  labels:
    app: cert-audit
spec:
  schedule: "0 9 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Self-clean finished Jobs after 7 days. `failedJobsHistoryLimit` keeps
      # the three most recent failures, so once a failure is fixed the stale
      # Job object keeps firing KubeJobFailed until three more failures
      # replace it. With a weekly schedule this TTL drops a stale Job before
      # the next run. Mirrors the sitio-rails-sqlite-backup CronJobs.
      ttlSecondsAfterFinished: 604800
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: cert-audit
        spec:
          serviceAccountName: cert-audit
          restartPolicy: Never
          containers:
            - name: audit
              # Fully qualified ref: OCI containerd enforces short-name mode and refuses bare "alpine/k8s".
              image: docker.io/alpine/k8s:1.37.0
              command:
                - /bin/sh
                - -ec
                - |
                  apk add --no-cache bash openssl >/dev/null
                  exec bash /scripts/audit-tls-secrets.sh
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: cert-audit-script
                defaultMode: 0755
