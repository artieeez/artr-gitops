apiVersion: batch/v1
kind: CronJob
metadata:
  name: app-backup-tinyauth
  namespace: platform
  labels:
    app.kubernetes.io/name: app-backup-tinyauth
    app.kubernetes.io/component: app-backup
spec:
  schedule: "15 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # TTL also reaps one-off Jobs made with `kubectl create job --from`.
      ttlSecondsAfterFinished: 604800
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: app-backup-tinyauth
            app.kubernetes.io/component: app-backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              # Digest-pinned (multi-arch index; the nodes are arm64), so
              # IfNotPresent is correct per docs/image-pull-policy.md. Renovate
              # bumps the tag/digest pair. Runs as root on purpose: it installs
              # its tools at start (see docs/app-backups.md) and the NFS export
              # is no_root_squash, which is how it reads data dirs owned by other uids.
              image: public.ecr.aws/amazonlinux/amazonlinux:2023@sha256:47a249649c57ca32b2d4bd5f46149383d5852610eb2c6230e33ce9c3ab8c8459
              imagePullPolicy: IfNotPresent
              command:
                - /scripts/backup.sh
              env:
                - name: NAMESPACE
                  value: platform
                - name: APP
                  value: tinyauth
                - name: DATA_DIR
                  value: /data
                - name: BUCKET
                  value: cluster-app-backups
                - name: TMPDIR
                  value: /tmp
                - name: AWS_DEFAULT_REGION
                  value: sa-vinhedo-1
                - name: AWS_ENDPOINT_URL
                  value: https://axtvnrdemzo7.compat.objectstorage.sa-vinhedo-1.oci.customer-oci.com
                # Append-only key, sealed cluster-wide in apps/app-backups/base (docs/app-backups.md).
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: app-backup-s3-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: app-backup-s3-credentials
                      key: secret-access-key
                - name: MODE
                  value: sqlite
                - name: SQLITE_FILE
                  value: tinyauth.db
              resources:
                # Peak is the package install (~400 MiB, see
                # docs/sqlite-backup-runbook.md), not the data.
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: platform-tinyauth-data
                readOnly: true
            - name: scripts
              configMap:
                name: app-backup-scripts
                defaultMode: 0755
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
